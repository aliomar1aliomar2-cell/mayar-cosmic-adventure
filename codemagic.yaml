
workflows:
  mayar-ios:
    name: Mayar Cosmic Adventure iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest
      cocoapods: default
      node: 22

    scripts:
      - name: Extract game project
        script: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          PACKAGE_FILE=$(find unpacked -name package.json -not -path '*/node_modules/*' -print -quit)
          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          cd "$PROJECT_DIR"
          npm install
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          cd ios/App
          pod install
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - DerivedData/Build/Products/Debug-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
